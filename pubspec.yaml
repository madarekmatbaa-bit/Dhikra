name: dhikra
description: "ذِكرى: أوراد يومية من القرآن وصحيح البخاري وكتبك، مع الأذكار ودفتر للفوائد."
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  hijri: ^3.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  timezone: ^0.11.2
  adhan: ^2.0.0+1
  geolocator: ^14.0.1
  home_widget: ^0.10.0
  pdfrx: ^2.11.0
  url_launcher: ^6.3.3
  speech_to_text: ^7.5.0
  wakelock_plus: ^1.8.2
  audioplayers: ^6.8.1
  sensors_plus: ^7.1.1
  record: ^7.2.0
  ffi: ^2.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hadith.db
    - assets/data/adhkar.json
    - assets/data/quran.db
    - assets/data/phoneme_tokens.txt
    - assets/sounds/mistake.wav
  fonts:
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
    - family: Naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-700.ttf
          weight: 700
    - family: Hafs
      fonts:
        - asset: assets/fonts/KFGQPC-Hafs-18.ttf
