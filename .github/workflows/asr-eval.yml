name: تقييم التسميع

# يشغّل متابعة التلاوة كما في التطبيق على أكثر من ألف آية لقرّاء كثيرين، بأخطاء مقصودة
# (كلمة مبدلة وكلمة ساقطة) وبدونها، ويلخّص الأخطاء الكاذبة والالتقاط عند كل حدّ للتحقق.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/asr/eval*', 'test/asr_eval_test.dart', '.github/workflows/asr-eval.yml']
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: المكتبة والنموذج
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cmake -S android/app/src/main/cpp -B /tmp/asrbuild -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build /tmp/asrbuild -j 4 > /dev/null
          ls /tmp/asrbuild/*.so
          curl -sSfL https://github.com/madarekmatbaa-bit/Dhikra/releases/download/asr-2/quran-base-q5_1.bin -o /tmp/model.bin

      - name: التلاوات
        run: |
          mkdir -p /tmp/wav
          python3 tools/asr/eval_pick.py assets/data/quran.db ${{ matrix.shard }} 4 45 /tmp/voweled.tsv > /tmp/pick.txt
          bad=""
          while read r a; do
            case " $bad " in *" $r "*) continue;; esac
            if curl -sSfL --retry 3 "https://everyayah.com/data/$r/$a.mp3" -o /tmp/a.mp3; then
              ffmpeg -loglevel error -y -i /tmp/a.mp3 -ar 16000 -ac 1 -c:a pcm_s16le "/tmp/wav/$r-$a.wav" || true
            else
              echo "تعذّر $r/$a"
              [ -z "$(ls /tmp/wav | grep "^$r-")" ] && bad="$bad $r"
            fi
          done < /tmp/pick.txt
          echo "قرّاء غير موجودين:$bad"
          ls /tmp/wav | wc -l

      - name: التقييم
        run: |
          flutter pub get > /dev/null
          ASR_EVAL=/tmp/wav ASR_LIB=$(ls /tmp/asrbuild/*.so) MODEL=/tmp/model.bin VOWELED=/tmp/voweled.tsv \
            OUT=eval-${{ matrix.shard }}.csv flutter test test/asr_eval_test.dart --reporter expanded
          python3 tools/asr/eval_report.py eval-${{ matrix.shard }}.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.shard }}
          path: eval-${{ matrix.shard }}.csv

  report:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: res
          merge-multiple: true
      - name: الملخص
        run: python3 tools/asr/eval_report.py res/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
