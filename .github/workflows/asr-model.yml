name: نموذج سماع التلاوة

on:
  push:
    branches: ['claude/**']
    paths: ['tools/asr/**', '.github/workflows/asr-model.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_A: https://github.com/mnsh2011-ship-it/mushaf-voice-models/releases/download/v1/zipformer_p_arabic_v3.int8.onnx
  SHA_A: 6a5ddafa9c5e5c01260d30264031b341785bdc152e9ef1d569b41c8c278508eb
  MODEL_B: https://github.com/zmkhtr/tilawa/releases/download/v0.3.0/zipformer_interp_gentle_a05.int8.onnx
  SHA_B: eaf099afefbe5cc8c9aee74df864ce7cc69744271e4f3bb46ef6c17612fbe335

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تنزيل النموذجين والتحقق من بصمتهما
        run: |
          mkdir -p out
          curl -sSfL --retry 3 "$MODEL_A" -o out/quran-zipformer-a.int8.onnx
          curl -sSfL --retry 3 "$MODEL_B" -o out/quran-zipformer-b.int8.onnx
          echo "$SHA_A  out/quran-zipformer-a.int8.onnx" | sha256sum -c -
          echo "$SHA_B  out/quran-zipformer-b.int8.onnx" | sha256sum -c -
          cp licenses/NPL-1.2.txt out/
          (cd out && sha256sum *.onnx > SHA256SUMS && cat SHA256SUMS && ls -la)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: asr-3
          name: نموذج سماع التلاوة
          prerelease: true
          body: |
            نموذج Zipformer من Quran-Lab يسمع التلاوة حرفاً حرفاً (ONNX). ينزّله التطبيق تلقائياً.
            رخصته NPL-1.2 (في الملف المرفق): يُستعمل ويُوزَّع مجاناً، ولا يُباع ولا تُباع ميزة تقوم عليه.
          files: |
            out/quran-zipformer-a.int8.onnx
            out/quran-zipformer-b.int8.onnx
            out/NPL-1.2.txt
            out/SHA256SUMS
