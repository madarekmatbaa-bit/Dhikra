name: بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # بلا مفتاح التوقيع نوقف البناء، لأن نسخة بمفتاح آخر لا تُثبَّت فوق النسخة الموجودة على الهاتف.
      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::أضف السرّين KEYSTORE_BASE64 و KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/dhikra.p12
          cat > android/key.properties <<PROPS
          storeFile=dhikra.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=dhikra
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: تسمية الملف
        run: cp build/app/outputs/flutter-apk/app-release.apk "dhikra-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dhikra-apk
          path: dhikra-${{ github.run_number }}.apk

      - name: نشر إصدار للتحميل
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ذِكرى · نسخة ${{ github.run_number }}
          body: ملف APK للتثبيت المباشر على أندرويد. حمّل الملف من الأسفل وثبّته.
          files: dhikra-${{ github.run_number }}.apk
