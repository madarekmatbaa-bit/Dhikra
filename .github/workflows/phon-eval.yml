name: تقييم المتابعة بالأصوات

# يشغّل نموذج متابعة التلاوة (Zipformer) على تسجيلات قرّاء كثيرين وعلى تسجيلات قرّاء عاديين
# بهواتفهم (RetaSy)، وينشر مخرجه المضغوط (ملفات ‎.top‎) ليُقيَّم به المتابِع
# (test/phoneme_eval_test.dart) دون إعادة تشغيل النموذج.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/phon_eval/**', '.github/workflows/phon-eval.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_A: https://github.com/mnsh2011-ship-it/mushaf-voice-models/releases/download/v1/zipformer_p_arabic_v3.int8.onnx
  MODEL_B: https://github.com/zmkhtr/tilawa/releases/download/v0.3.0/zipformer_interp_gentle_a05.int8.onnx

jobs:
  everyayah:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: الأدوات والنموذج
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q onnxruntime kaldi-native-fbank numpy
          curl -sSfL "$MODEL_A" -o /tmp/a.onnx
          curl -sSfL "$MODEL_B" -o /tmp/b.onnx
          sha256sum /tmp/a.onnx /tmp/b.onnx
      - name: التلاوات
        run: |
          mkdir -p /tmp/wav
          python3 tools/phon_eval/pick.py assets/data/quran.db ${{ matrix.shard }} 4 45 > /tmp/pick.txt
          bad=""
          while read r a; do
            case " $bad " in *" $r "*) continue;; esac
            if curl -sSfL --retry 3 "https://everyayah.com/data/$r/$a.mp3" -o /tmp/a.mp3; then
              ffmpeg -loglevel error -y -i /tmp/a.mp3 -ar 16000 -ac 1 -c:a pcm_s16le "/tmp/wav/$r-$a.wav" || true
            else
              echo "تعذّر $r/$a"
              [ -z "$(ls /tmp/wav | grep "^$r-")" ] && bad="$bad $r"
            fi
          done < /tmp/pick.txt
          ls /tmp/wav | wc -l
      - name: النموذج على التلاوات
        run: |
          mkdir -p ea/m0 ea/m1
          python3 tools/phon_eval/phon_dump.py /tmp/a.onnx ea/m0 /tmp/wav/*.wav
          python3 tools/phon_eval/phon_dump.py /tmp/b.onnx ea/m1 /tmp/wav/*.wav
          tar czf everyayah-${{ matrix.shard }}.tgz ea
      - uses: actions/upload-artifact@v4
        with:
          name: everyayah-${{ matrix.shard }}
          path: everyayah-${{ matrix.shard }}.tgz

  retasy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: الأدوات والنموذج
        run: |
          pip install -q onnxruntime kaldi-native-fbank numpy pyarrow soundfile scipy
          curl -sSfL "$MODEL_A" -o /tmp/a.onnx
          curl -sSfL "$MODEL_B" -o /tmp/b.onnx
      - name: التسجيلات
        run: |
          curl -sSfL --retry 3 "https://huggingface.co/datasets/RetaSy/quranic_audio_dataset/resolve/main/data/train-0000${{ matrix.shard }}-of-00003.parquet" -o /tmp/d.parquet
          ls -la /tmp/d.parquet
          python3 - <<'PY'
          import pyarrow.parquet as pq
          f = pq.ParquetFile('/tmp/d.parquet')
          print(f.schema_arrow)
          print(f.metadata.num_rows)
          PY
      - name: النموذج على التسجيلات
        run: |
          mkdir -p rt
          python3 tools/phon_eval/retasy.py /tmp/d.parquet ${{ matrix.shard }} rt /tmp/a.onnx /tmp/b.onnx
          head -5 rt/*.tsv
          tar czf retasy-${{ matrix.shard }}.tgz rt
      - uses: actions/upload-artifact@v4
        with:
          name: retasy-${{ matrix.shard }}
          path: retasy-${{ matrix.shard }}.tgz

  publish:
    needs: [everyayah, retasy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: res
          merge-multiple: true
      - run: ls -la res
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: phon-eval
          name: تقييم المتابعة بالأصوات
          prerelease: true
          body: مخرج نموذج متابعة التلاوة على تسجيلات التقييم (ملفات ‎.top‎)، ليُعاد تقييم المتابِع بها.
          files: res/*.tgz
